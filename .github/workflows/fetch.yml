name: fetch-site
on:
  push:
    paths: ['.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Xindee web app
        run: |
          B=https://dulcet-tulumba-743d3c.netlify.app
          for f in index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
            curl -fsSL --retry 3 "$B/$f" -o "$f"
          done
          ls -la
          head -c 300 sw.js
          touch .nojekyll
      - name: Commit
        run: |
          git config user.name "xindee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add Xindee web app"
          git push
